[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortnite-auto-replay"
version = "0.5.0"
description = "Bot de rejeu automatique Fortnite piloté par reconnaissance d'écran"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.0", "cryptography>=42"]

[project.optional-dependencies]
fast = ["mss>=9.0", "dxcam>=0.0.5; sys_platform == 'win32'", "opencv-python>=4.9", "pydirectinput>=1.0.4; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fnreplay = "fortnite_auto_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortnite_auto_replay = ["../../config/default.json", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PYI", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004"]
